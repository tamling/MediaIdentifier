name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Core tests
    runs-on: macos-15
    # Without this a hung test would burn the default six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run Swift tests
        # bash explicitly: the Linux container's default shell is dash, which
        # has no `set -o pipefail` and would abort the step immediately.
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      # Keep failures readable: the full log is thousands of lines, and the
      # interesting part is buried in the middle of it.
      - name: Failing assertions
        if: failure()
        shell: bash
        run: |
          echo "--- failed assertions ---"
          grep -E ": error:|XCTAssert.* failed" test.log | head -60 || true
          echo "--- totals ---"
          grep -E "Executed [0-9]+ tests" test.log | tail -2 || true

  # Linux is a target platform: the portable Core (and later the web UI) must
  # build and pass its tests there, not just on macOS.
  linux:
    name: Linux Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # `swift build` with no product builds every target, and on Linux that
      # now includes the GTK front-end. Its headers have to be here or the
      # whole job fails on a target it is not even meant to exercise.
      - name: Install GTK3 headers
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq pkg-config libgtk-3-dev
      # A real SSH server, so the transfer code is tested by transferring
      # rather than by reading its own arguments back. Everything else about
      # that feature can be checked without a network; whether the command
      # lines actually work cannot.
      - name: Start an SSH server for the transfer tests
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y -qq openssh-server openssh-client rsync sshpass

          # A separate sshd on a high port with its own config: nothing here
          # touches the container's own ssh setup, and the whole thing dies
          # with the job.
          mkdir -p /run/sshd /tmp/mediafin-sshd /tmp/mediafin-remote
          ssh-keygen -q -t ed25519 -f /tmp/mediafin-sshd/host_key -N ""

          # The account the tests log in as. A throwaway password, printed
          # here on purpose: it exists for ninety seconds inside a container
          # that is discarded, and pretending it is a secret would only make
          # the next person wonder where the real one is.
          useradd -m -s /bin/bash mediafintest
          echo 'mediafintest:transfer-test-password' | chpasswd
          chmod 777 /tmp/mediafin-remote

          ssh-keygen -q -t ed25519 -f /tmp/mediafin-sshd/client_key -N ""
          install -d -m 700 -o mediafintest -g mediafintest /home/mediafintest/.ssh
          install -m 600 -o mediafintest -g mediafintest \
            /tmp/mediafin-sshd/client_key.pub /home/mediafintest/.ssh/authorized_keys

          cat > /tmp/mediafin-sshd/sshd_config <<CONF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /tmp/mediafin-sshd/host_key
          PidFile /tmp/mediafin-sshd/sshd.pid
          PasswordAuthentication yes
          PubkeyAuthentication yes
          UsePAM no
          PermitRootLogin no
          Subsystem sftp /usr/lib/openssh/sftp-server
          CONF
          /usr/sbin/sshd -f /tmp/mediafin-sshd/sshd_config
          for _ in $(seq 1 30); do
            ss -ltn 2>/dev/null | grep -q ':2222' && break
            sleep 0.5
          done

          # The host key goes into known_hosts the same way a user would put
          # it there: by looking at it once. StrictHostKeyChecking stays on,
          # and one test deliberately uses a name that is NOT in here to
          # prove the check still bites.
          #
          # Written to the system-wide file as well as this user's, because
          # the Swift test process need not have the same HOME as this step
          # — and a first attempt failed exactly there, with ssh reporting
          # the key as unknown while the file sat in another home directory.
          # stderr is NOT discarded: a keyscan that prints nothing would
          # otherwise leave an empty file and a green step.
          install -d -m 700 ~/.ssh
          ssh-keyscan -p 2222 127.0.0.1 > /tmp/mediafin-sshd/known_hosts
          grep -q ed25519 /tmp/mediafin-sshd/known_hosts || {
            echo "FAIL: ssh-keyscan returned no ed25519 key for 127.0.0.1:2222"
            cat /tmp/mediafin-sshd/known_hosts
            exit 1
          }
          cat /tmp/mediafin-sshd/known_hosts >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          install -d -m 755 /etc/ssh
          cat /tmp/mediafin-sshd/known_hosts >> /etc/ssh/ssh_known_hosts
          chmod 644 /etc/ssh/ssh_known_hosts

          # Prove it before the tests rely on it. A login that works here
          # with strict checking on is the one thing that distinguishes
          # "the server is ready" from "the server exists".
          ssh -i /tmp/mediafin-sshd/client_key -p 2222 \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            mediafintest@127.0.0.1 'echo ssh login ok' || {
            echo "FAIL: cannot log in to the test server with the host key known"
            echo "HOME=$HOME"
            ls -l ~/.ssh/known_hosts /etc/ssh/ssh_known_hosts || true
            exit 1
          }
          # testAnUnknownHostIsRefused reaches the same sshd as "localhost"
          # and expects to be turned away. That only means anything while
          # "localhost" resolves and is absent from known_hosts.
          getent hosts localhost > /dev/null || {
            echo "FAIL: localhost does not resolve; the unknown-host test would"
            echo "      fail for the wrong reason"
            exit 1
          }
          if grep -qw localhost ~/.ssh/known_hosts /etc/ssh/ssh_known_hosts; then
            echo "FAIL: localhost is in known_hosts; the unknown-host test would"
            echo "      pass without proving anything"
            exit 1
          fi
          # Why the sftp arguments are ordered the way they are, demonstrated
          # rather than asserted in a comment. `sftp -b` appends its own
          # "-obatchmode yes" as it parses -b, and ssh keeps the FIRST
          # setting of an option — so BatchMode=no only takes effect ahead of
          # -b. If a future OpenSSH changes that, this step says so plainly
          # instead of the password test failing with "Permission denied".
          export SSHPASS=transfer-test-password
          echo "put /etc/hostname /tmp/mediafin-remote/order-check.txt" > /tmp/mediafin-sshd/b
          after=0
          sshpass -e sftp -b /tmp/mediafin-sshd/b -P 2222 \
            -o BatchMode=no -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes mediafintest@127.0.0.1 >/dev/null 2>&1 || after=$?
          before=0
          sshpass -e sftp -o BatchMode=no -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -b /tmp/mediafin-sshd/b -P 2222 \
            mediafintest@127.0.0.1 >/dev/null 2>&1 || before=$?
          echo "sftp password login — options after -b: exit $after, before -b: exit $before"
          test "$before" -eq 0 || {
            echo "FAIL: password login over sftp does not work even with the options"
            echo "      ahead of -b; the ordering fix in RemoteCommand.sftp rests on this"
            exit 1
          }
          rm -f /tmp/mediafin-remote/order-check.txt
          unset SSHPASS

          echo "sshd is up on 127.0.0.1:2222"
      # A real yt-dlp against a real HTTP server, for the same reason the
      # transfer tests run against a real sshd: the command line can only
      # be proved by running it. No internet is involved — the file is
      # built here and served from 127.0.0.1.
      - name: Serve a media file locally for the download tests
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y -qq ffmpeg python3-pip
          pip3 install --quiet yt-dlp
          yt-dlp --version

          mkdir -p /tmp/mediafin-www
          # Small enough to build in a couple of seconds, large enough that
          # a rate limit produces a dozen progress updates.
          ffmpeg -nostdin -loglevel error -y \
            -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440 \
            -t 20 -c:v libx264 -preset veryfast -b:v 900k -pix_fmt yuv420p \
            -c:a aac -shortest /tmp/mediafin-www/Sample.Video.2024.1080p.mp4
          ls -l /tmp/mediafin-www

          cd /tmp/mediafin-www
          nohup python3 -m http.server 18080 --bind 127.0.0.1 \
            > /tmp/mediafin-www/httpd.log 2>&1 &
          # Asked with python3, not curl: curl is NOT in this container, and
          # a check that cannot run reports the same thing as a server that
          # did not start. That mistake has already cost this project a
          # debugging round once.
          #
          # A one-liner, not a here-document: an indented here-document
          # terminator is not a terminator, and the whole step then runs to
          # end of file. That cost the round before this one.
          U=http://127.0.0.1:18080/Sample.Video.2024.1080p.mp4
          up=0
          for _ in $(seq 1 40); do
            if python3 -c "import urllib.request; urllib.request.urlopen('$U', timeout=2).read(16)" 2>/dev/null; then
              up=1; break
            fi
            sleep 0.5
          done
          test "$up" = 1 || {
            echo "FAIL: the local HTTP server did not come up"
            cat /tmp/mediafin-www/httpd.log; exit 1; }

          # Demonstrated rather than asserted in a comment, like the sftp
          # option-ordering check above. --print implies --quiet implies
          # noprogress, so the progress template is silently discarded
          # unless --progress is passed. If a future yt-dlp changes that,
          # this says so instead of a progress test failing for a reason
          # nobody can see.
          T='download:MFPROG|%(progress.status)s'
          mkdir -p /tmp/q1 /tmp/q2
          n1=$(yt-dlp --ignore-config --newline --no-colors --progress-template "$T" \
               --print after_move:filepath -P home:/tmp/q1 -o '%(id)s.%(ext)s' -- "$U" \
               2>/dev/null | grep -c MFPROG || true)
          n2=$(yt-dlp --ignore-config --newline --progress --no-colors \
               --progress-template "$T" --print after_move:filepath -P home:/tmp/q2 \
               -o '%(id)s.%(ext)s' -- "$U" 2>/dev/null | grep -c MFPROG || true)
          echo "progress lines — without --progress: $n1, with it: $n2"
          test "$n1" -eq 0 || echo "NOTE: --print no longer implies --quiet"
          test "$n2" -ge 2 || {
            echo "FAIL: no progress through a pipe even with --progress"; exit 1; }
          rm -rf /tmp/q1 /tmp/q2
          echo "http server is up on 127.0.0.1:18080"
      - name: Build
        run: swift build
      - name: Run Swift tests
        # bash explicitly: the Linux container's default shell is dash, which
        # has no `set -o pipefail` and would abort the step immediately.
        shell: bash
        env:
          # Picked up by RemoteTransferIntegrationTests, which skip entirely
          # when this is unset — as they do on macOS, where there is no sshd.
          MEDIAFIN_SSH_TEST_HOST: 127.0.0.1
          MEDIAFIN_SSH_TEST_PORT: "2222"
          MEDIAFIN_SSH_TEST_USER: mediafintest
          MEDIAFIN_SSH_TEST_KEY: /tmp/mediafin-sshd/client_key
          MEDIAFIN_SSH_TEST_PASSWORD: transfer-test-password
          MEDIAFIN_SSH_TEST_BASE: /tmp/mediafin-remote
          # Picked up by VideoDownloadIntegrationTests, which skip without it.
          MEDIAFIN_HTTP_TEST_URL: http://127.0.0.1:18080/Sample.Video.2024.1080p.mp4
          MEDIAFIN_HTTP_TEST_FILE: /tmp/mediafin-www/Sample.Video.2024.1080p.mp4
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Failing assertions
        if: failure()
        shell: bash
        run: |
          echo "--- failed assertions ---"
          grep -E ": error:|XCTAssert.* failed" test.log | head -60 || true
          echo "--- totals ---"
          grep -E "Executed [0-9]+ tests" test.log | tail -2 || true
      # Same reasoning as the transfer guard below: a skipped test reports
      # success, and this suite has already had one silently skip itself
      # five runs in a row.
      - name: The download tests must have run
        shell: bash
        run: |
          set -uo pipefail
          if grep -q "VideoDownloadIntegrationTests.*skipped" test.log; then
            echo "FAIL: the download tests were skipped; the HTTP server did not come up"
            grep -E "VideoDownloadIntegrationTests" test.log | head -20
            exit 1
          fi
          ran=$(grep -cE "Test Case .*VideoDownloadIntegrationTests.* passed" test.log \
                || true)
          echo "download tests passed: $ran"
          test "$ran" -ge 5 || {
            echo "FAIL: expected at least 5 download tests, saw $ran"
            exit 1
          }
      # A skipped transfer test is a test that proves nothing, and a skip is
      # quiet. This makes it loud: if the sshd setup silently stops working,
      # the job fails here instead of going green with the feature untested.
      - name: The transfer tests must have run
        shell: bash
        run: |
          set -uo pipefail
          # Both suites: RemoteSendIntegrationTests covers the deletion
          # path and was not named here, although its own header said the
          # CI step guarded it.
          if grep -qE "Remote(Transfer|Send)IntegrationTests.*skipped" test.log; then
            echo "FAIL: transfer tests were skipped; the SSH server did not come up"
            grep -E "Remote(Transfer|Send)IntegrationTests" test.log | head -20
            exit 1
          fi
          ran=$(grep -cE "Test Case .*RemoteTransferIntegrationTests.* passed" test.log || true)
          sent=$(grep -cE "Test Case .*RemoteSendIntegrationTests.* passed" test.log || true)
          echo "transfer tests passed: $ran, send tests passed: $sent"
          test "$sent" -ge 5 || {
            echo "FAIL: expected at least 5 send tests, saw $sent"
            exit 1
          }
          test "$ran" -ge 7 || {
            echo "FAIL: expected at least 7 transfer tests to run, saw $ran"
            exit 1
          }
      # openssl creates the self-signed certificate on first start.
      - name: Ensure openssl and curl are present
        shell: bash
        run: |
          command -v openssl >/dev/null && command -v curl >/dev/null && exit 0
          apt-get update -qq
          apt-get install -y -qq openssl curl
      # Runs the real binary against a real socket: HTTPS, the access gate and
      # the refusal to answer plaintext on the TLS port.
      - name: Smoke-test the mediafin binary
        shell: bash
        run: ./tools/smoke-mediafin.sh
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: mediafin-linux-x86_64
          path: .build/release/mediafin
          if-no-files-found: error

  # A graphical interface is developed here without a screen to look at, so
  # "it compiles" would be the only signal — and that says nothing about
  # whether the window draws. This job runs the real binary under Xvfb, makes
  # it render itself to a PNG, and checks the result has sensible dimensions.
  # The PNG is kept as an artifact and also emitted base64 in the log, because
  # artifact storage is not reachable from every environment that needs to
  # read it.
  gtk:
    name: GTK front-end (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3, Xvfb and a font
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # fonts-dejavu-core is not optional: with no font installed Pango
          # draws nothing, and the screenshot would be a blank window that
          # still passed every check.
          #
          # The rest is so the screenshot shows what a user sees rather than
          # GTK's bare fallbacks: Cantarell is the font the Adwaita theme is
          # designed around, and without an icon theme the header bar's
          # controls render as "missing image" squares.
          apt-get install -y -qq pkg-config libgtk-3-dev xvfb file \
            fonts-dejavu-core fonts-cantarell adwaita-icon-theme
      - name: Build
        run: swift build -c release --product mediafin-gtk
      - name: Render the window headless
        shell: bash
        env:
          # at-spi is not running in a container; without these GTK spends
          # seconds timing out against it and floods the log.
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
          # GTK_THEME is deliberately NOT set: the application picks
          # Adwaita:dark itself and only when nothing else asked for a theme,
          # so setting it here would override the very behaviour the
          # screenshot is meant to show.
        run: |
          set -euo pipefail
          # --demo points the engine at a throwaway library of plausible
          # release names and scans it, so the picture shows the interface
          # doing its job rather than its empty state. It runs the real
          # parser and planner, so this fails if either stops working.
          timeout 90 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            .build/release/mediafin-gtk --demo --screenshot window.png | tee shot.log
          file window.png
          # Dimensions in the hundreds: a 1x1 PNG is what GTK produces when the
          # widget was never laid out, and it would otherwise look like a pass.
          file window.png | grep -qE 'PNG image data, [0-9]{3,} x [0-9]{3,}'
          echo "bytes: $(stat -c %s window.png)"
          # Two checks, because they catch different failures and I learned
          # that the hard way by replacing one with the other.
          #
          # The count says the engine produced proposals. One per demo file is
          # expected; less means the parser or the planner dropped something.
          captured="$(sed -n 's/^Captured \([0-9]*\) proposals$/\1/p' shot.log)"
          echo "proposals in the picture: ${captured:-none}"
          test "${captured:-0}" -ge 8 || {
            echo "FAIL: expected at least 8 proposals, the demo library has 8 files"
            exit 1
          }
          # The size says the picture is of something. A blank window is a
          # valid PNG that passes every other check and compresses to a few
          # kilobytes; a drawn one has never been under 20 kB. This is the
          # only check that notices the window rendering nothing at all.
          bytes="$(stat -c %s window.png)"
          test "$bytes" -gt 12000 || {
            echo "FAIL: $bytes bytes — the window rendered blank"
            exit 1
          }
          # A window left sitting under Xvfb stops being drawable after a
          # couple of seconds — it renders fully at 400 ms and not at all at
          # 3000, while still reporting itself mapped and visible. That cost
          # four rounds to find, so it is measured on every run and printed.
          #
          # Reported, not asserted. A check that fails when the workaround
          # becomes unnecessary would turn a GTK update into a red build for
          # something that is not broken.
          timeout 60 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            .build/release/mediafin-gtk --delay 3000 --screenshot late.png || true
          late="$(stat -c %s late.png 2>/dev/null || echo 0)"
          if [ "$late" -lt 12000 ]; then
            echo "late capture (3000 ms): $late bytes — still blank, as expected"
          else
            echo "late capture (3000 ms): $late bytes — this now renders."
            echo "  The early-capture workaround in main.swift may be removable."
          fi
      # Before the checks that can fail: the rendered window is the most
      # useful thing this job produces, and a later failing assertion must not
      # be what stops it being readable.
      - name: It fits a small screen
        shell: bash
        env:
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
        run: |
          set -euo pipefail
          # The bug this asserts against, and the reason it is measured and
          # not reasoned about: a GtkWindow cannot be made shorter than its
          # content's minimum height. The left column's minimum was around a
          # thousand pixels - six cards at 18px padding, plus a 260px floor
          # under the proposals list - so on a 1366x768 laptop the window
          # opened taller than the screen and the row carrying "Umbenennen"
          # and "Rueckgaengig", and the footer under it, sat below the bottom
          # edge. Resizing, maximising and fullscreen could none of them help,
          # because there was no shorter size for the window to take.
          #
          # 1024x600 is a netbook: the smallest screen anybody runs a desktop
          # on, and under Xvfb there are no panels, so the whole 600 is the
          # work area.
          timeout 90 xvfb-run -a --server-args="-screen 0 1024x600x24" \
            .build/release/mediafin-gtk --demo --screenshot small.png | tee small.log
          file small.png
          dims="$(file small.png | sed -n 's/.*PNG image data, \([0-9]*\) x \([0-9]*\).*/\1 \2/p')"
          test -n "$dims" || { echo "FAIL: could not read the PNG size"; exit 1; }
          w="${dims% *}"
          h="${dims#* }"
          echo "the window on a 1024x600 screen: ${w}x${h}"
          test "$h" -le 600 || {
            echo "FAIL: ${h}px tall on a 600px screen - the bottom cannot be reached"
            exit 1
          }
          test "$w" -le 1024 || {
            echo "FAIL: ${w}px wide on a 1024px screen"
            exit 1
          }
          # Fitting by collapsing to nothing is not fitting. A drawn window
          # has never been under 12 kB.
          bytes="$(stat -c %s small.png)"
          test "$bytes" -gt 12000 || {
            echo "FAIL: $bytes bytes - it fits because it rendered blank"
            exit 1
          }
          echo "ok: ${w}x${h}, ${bytes} bytes drawn"
      - name: Emit the small-screen window as base64
        shell: bash
        run: |
          set -euo pipefail
          echo "--- BEGIN small.png base64 ---"
          base64 -w 120 small.png
          echo "--- END small.png base64 ---"
      - name: Emit the screenshot as base64
        shell: bash
        run: |
          set -euo pipefail
          echo "--- BEGIN window.png base64 ---"
          base64 -w 120 window.png
          echo "--- END window.png base64 ---"
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-window-screenshot
          path: |
            window.png
            small.png
          if-no-files-found: warn
      - name: Refuse to hang without a display
        shell: bash
        run: |
          # No `set -e` here, and no `set +e` either: GitHub already invokes
          # this shell as `bash -e -o pipefail`, so the expected non-zero exit
          # would abort the step before $? could be read. `|| code=$?` is the
          # form that survives -e.
          set -uo pipefail
          code=0
          timeout 20 env -u DISPLAY -u WAYLAND_DISPLAY \
            .build/release/mediafin-gtk --screenshot should-not-exist.png || code=$?
          if [ "$code" != 2 ]; then
            echo "FAIL: expected exit 2 with no display, got $code"
            exit 1
          fi
          if [ -e should-not-exist.png ]; then
            echo "FAIL: wrote a file although it could not start"
            exit 1
          fi
          echo "ok    : exits 2 with no display and writes nothing"

  app:
    name: Build .app
    runs-on: macos-15
    # Measured at about five minutes once the app links SwiftNIO, so 40 is
    # ample and still catches a hang quickly.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Mediafin.xcodeproj \
            -scheme Mediafin \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package .app
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          echo "Built: $APP"
          ARCHS_OUT=$(lipo -archs "$APP/Contents/MacOS/Mediafin")
          echo "Architectures: $ARCHS_OUT"
          case "$ARCHS_OUT" in
            *arm64*x86_64*|*x86_64*arm64*) echo "Universal binary OK." ;;
            *) echo "::error::Expected a universal binary but got: $ARCHS_OUT"; exit 1 ;;
          esac
          # Ad-hoc sign so the unsigned universal app is not rejected as "damaged".
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Mediafin.app.zip
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mediafin-app
          path: Mediafin.app.zip
          if-no-files-found: error
