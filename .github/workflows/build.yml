name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  # First, and on a bare runner rather than in a container: PyYAML is there
  # on a GitHub-hosted image and is not guaranteed in the Swift container.
  #
  # This exists because `yaml.safe_load` accepts a mapping with the same key
  # twice and keeps the last one, while GitHub Actions rejects it outright.
  # A bad edit put two `with:` blocks on one step of the release workflow, a
  # permissive load called it fine, and the next release refused to start --
  # which is a thing you find out at the moment you need a release.
  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a workflow Actions would refuse
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 tools/check-workflows.py .github/workflows/*.yml

  test:
    name: Core tests
    runs-on: macos-15
    # Without this a hung test would burn the default six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run Swift tests
        # bash explicitly: the Linux container's default shell is dash, which
        # has no `set -o pipefail` and would abort the step immediately.
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      # Keep failures readable: the full log is thousands of lines, and the
      # interesting part is buried in the middle of it.
      - name: Failing assertions
        if: failure()
        shell: bash
        run: |
          echo "--- failed assertions ---"
          grep -E ": error:|XCTAssert.* failed" test.log | head -60 || true
          echo "--- totals ---"
          grep -E "Executed [0-9]+ tests" test.log | tail -2 || true

  # Linux is a target platform: the portable Core (and later the web UI) must
  # build and pass its tests there, not just on macOS.
  linux:
    name: Linux Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      # A URLSession that is released instead of invalidated aborts the
      # process on Linux: "_MultiHandle deallocated with non-zero retain
      # count". That cost an evening, and the Swift test for it can only prove
      # the process survived -- it cannot stop a new one being built somewhere
      # else. This can.
      - name: Only one place may build a URLSession
        shell: bash
        run: |
          set -euo pipefail
          stray="$(grep -rn "URLSession(configuration" Sources/ \
            --include='*.swift' \
            | grep -v "^Sources/MediaIdentifierCore/Networking/HTTPTransport.swift" \
            || true)"
          if [ -n "$stray" ]; then
            echo "FAIL: a URLSession is built outside HTTPTransport.swift:"
            echo "$stray"
            echo "Use SharedHTTPSession.ephemeral — releasing a session aborts on Linux."
            exit 1
          fi
          echo "ok: only HTTPTransport.swift builds a session"
      - name: Swift version
        run: swift --version
      # `swift build` with no product builds every target, and on Linux that
      # now includes the GTK front-end. Its headers have to be here or the
      # whole job fails on a target it is not even meant to exercise.
      - name: Install GTK3 headers
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq pkg-config libgtk-3-dev
      # A real yt-dlp against a real HTTP server: the command line can only
      # be proved by running it. No internet is involved — the file is
      # built here and served from 127.0.0.1.
      - name: Serve a media file locally for the download tests
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y -qq ffmpeg python3-pip
          pip3 install --quiet yt-dlp
          yt-dlp --version

          mkdir -p /tmp/mediafin-www
          # Small enough to build in a couple of seconds, large enough that
          # a rate limit produces a dozen progress updates.
          ffmpeg -nostdin -loglevel error -y \
            -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440 \
            -t 20 -c:v libx264 -preset veryfast -b:v 900k -pix_fmt yuv420p \
            -c:a aac -shortest /tmp/mediafin-www/Sample.Video.2024.1080p.mp4
          ls -l /tmp/mediafin-www

          cd /tmp/mediafin-www
          nohup python3 -m http.server 18080 --bind 127.0.0.1 \
            > /tmp/mediafin-www/httpd.log 2>&1 &
          # Asked with python3, not curl: curl is NOT in this container, and
          # a check that cannot run reports the same thing as a server that
          # did not start. That mistake has already cost this project a
          # debugging round once.
          #
          # A one-liner, not a here-document: an indented here-document
          # terminator is not a terminator, and the whole step then runs to
          # end of file. That cost the round before this one.
          U=http://127.0.0.1:18080/Sample.Video.2024.1080p.mp4
          up=0
          for _ in $(seq 1 40); do
            if python3 -c "import urllib.request; urllib.request.urlopen('$U', timeout=2).read(16)" 2>/dev/null; then
              up=1; break
            fi
            sleep 0.5
          done
          test "$up" = 1 || {
            echo "FAIL: the local HTTP server did not come up"
            cat /tmp/mediafin-www/httpd.log; exit 1; }

          # Demonstrated rather than asserted in a comment, like the sftp
          # option-ordering check above. --print implies --quiet implies
          # noprogress, so the progress template is silently discarded
          # unless --progress is passed. If a future yt-dlp changes that,
          # this says so instead of a progress test failing for a reason
          # nobody can see.
          T='download:MFPROG|%(progress.status)s'
          mkdir -p /tmp/q1 /tmp/q2
          n1=$(yt-dlp --ignore-config --newline --no-colors --progress-template "$T" \
               --print after_move:filepath -P home:/tmp/q1 -o '%(id)s.%(ext)s' -- "$U" \
               2>/dev/null | grep -c MFPROG || true)
          n2=$(yt-dlp --ignore-config --newline --progress --no-colors \
               --progress-template "$T" --print after_move:filepath -P home:/tmp/q2 \
               -o '%(id)s.%(ext)s' -- "$U" 2>/dev/null | grep -c MFPROG || true)
          echo "progress lines — without --progress: $n1, with it: $n2"
          test "$n1" -eq 0 || echo "NOTE: --print no longer implies --quiet"
          test "$n2" -ge 2 || {
            echo "FAIL: no progress through a pipe even with --progress"; exit 1; }
          rm -rf /tmp/q1 /tmp/q2
          echo "http server is up on 127.0.0.1:18080"
      - name: Build
        run: swift build
      - name: Run Swift tests
        # bash explicitly: the Linux container's default shell is dash, which
        # has no `set -o pipefail` and would abort the step immediately.
        shell: bash
        env:
          # Picked up by VideoDownloadIntegrationTests, which skip without it.
          MEDIAFIN_HTTP_TEST_URL: http://127.0.0.1:18080/Sample.Video.2024.1080p.mp4
          MEDIAFIN_HTTP_TEST_FILE: /tmp/mediafin-www/Sample.Video.2024.1080p.mp4
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Failing assertions
        if: failure()
        shell: bash
        run: |
          echo "--- failed assertions ---"
          grep -E ": error:|XCTAssert.* failed" test.log | head -60 || true
          echo "--- totals ---"
          grep -E "Executed [0-9]+ tests" test.log | tail -2 || true
      # A skipped test reports success, and a skip is quiet: this suite has
      # already silently skipped itself five runs in a row. This makes it
      # loud — if the HTTP server stops coming up, the job fails here
      # instead of going green with the feature untested.
      - name: The download tests must have run
        shell: bash
        run: |
          set -uo pipefail
          if grep -q "VideoDownloadIntegrationTests.*skipped" test.log; then
            echo "FAIL: the download tests were skipped; the HTTP server did not come up"
            grep -E "VideoDownloadIntegrationTests" test.log | head -20
            exit 1
          fi
          ran=$(grep -cE "Test Case .*VideoDownloadIntegrationTests.* passed" test.log \
                || true)
          echo "download tests passed: $ran"
          test "$ran" -ge 5 || {
            echo "FAIL: expected at least 5 download tests, saw $ran"
            exit 1
          }
      # Runs the real binary: that --once comes back, that --watch stays up
      # and stops on SIGTERM, and that a bare invocation refuses rather than
      # silently doing nothing.
      - name: Smoke-test the mediafin binary
        shell: bash
        run: ./tools/smoke-mediafin.sh
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: mediafin-linux-x86_64
          path: .build/release/mediafin
          if-no-files-found: error

  # A graphical interface is developed here without a screen to look at, so
  # "it compiles" would be the only signal — and that says nothing about
  # whether the window draws. This job runs the real binary under Xvfb, makes
  # it render itself to a PNG, and checks the result has sensible dimensions.
  # The PNG is kept as an artifact and also emitted base64 in the log, because
  # artifact storage is not reachable from every environment that needs to
  # read it.
  gtk:
    name: GTK front-end (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3, Xvfb and a font
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # fonts-dejavu-core is not optional: with no font installed Pango
          # draws nothing, and the screenshot would be a blank window that
          # still passed every check.
          #
          # The rest is so the screenshot shows what a user sees rather than
          # GTK's bare fallbacks: Cantarell is the font the Adwaita theme is
          # designed around, and without an icon theme the header bar's
          # controls render as "missing image" squares.
          apt-get install -y -qq pkg-config libgtk-3-dev xvfb file \
            fonts-dejavu-core fonts-cantarell adwaita-icon-theme
      - name: Build
        run: swift build -c release --product mediafin-gtk
      # The headless runner draws nothing, so what is worth checking is that
      # it says what it offers rather than silently doing nothing, and that
      # --once finishes instead of hanging like the old server did.
      - name: The headless runner says what it offers and --once returns
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product mediafin
          .build/release/mediafin --help | grep -q -- "--watch"
          .build/release/mediafin --help | grep -q -- "--once"
          # No arguments must not start something: there is nothing to start.
          code=0
          .build/release/mediafin > bare.log 2>&1 || code=$?
          test "$code" = 64 || { echo "FAIL: bare invocation exited $code"; exit 1; }
          grep -q "mediafin-gtk" bare.log || {
            echo "FAIL: it did not say where the interface is"; exit 1; }
          # --once with nothing scheduled has nothing to do, and has to come
          # back rather than sit there: a cron line that never returns piles up.
          timeout 60 env MEDIAFIN_CONFIG_DIR="$(mktemp -d)" \
            .build/release/mediafin --once || {
            echo "FAIL: --once did not finish"; exit 1; }
      - name: Render the window headless
        shell: bash
        env:
          # at-spi is not running in a container; without these GTK spends
          # seconds timing out against it and floods the log.
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
          # GTK_THEME is deliberately NOT set: the application picks
          # Adwaita:dark itself and only when nothing else asked for a theme,
          # so setting it here would override the very behaviour the
          # screenshot is meant to show.
        run: |
          set -euo pipefail
          # --demo points the engine at a throwaway library of plausible
          # release names and scans it, so the picture shows the interface
          # doing its job rather than its empty state. It runs the real
          # parser and planner, so this fails if either stops working.
          timeout 90 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            .build/release/mediafin-gtk --demo --screenshot window.png | tee shot.log
          file window.png
          # Dimensions in the hundreds: a 1x1 PNG is what GTK produces when the
          # widget was never laid out, and it would otherwise look like a pass.
          file window.png | grep -qE 'PNG image data, [0-9]{3,} x [0-9]{3,}'
          echo "bytes: $(stat -c %s window.png)"
          # Two checks, because they catch different failures and I learned
          # that the hard way by replacing one with the other.
          #
          # The count says the engine produced proposals. One per demo file is
          # expected; less means the parser or the planner dropped something.
          captured="$(sed -n 's/^Captured \([0-9]*\) proposals$/\1/p' shot.log)"
          echo "proposals in the picture: ${captured:-none}"
          test "${captured:-0}" -ge 8 || {
            echo "FAIL: expected at least 8 proposals, the demo library has 8 files"
            exit 1
          }
          # The size says the picture is of something. A blank window is a
          # valid PNG that passes every other check and compresses to a few
          # kilobytes; a drawn one has never been under 20 kB. This is the
          # only check that notices the window rendering nothing at all.
          bytes="$(stat -c %s window.png)"
          test "$bytes" -gt 12000 || {
            echo "FAIL: $bytes bytes — the window rendered blank"
            exit 1
          }
          # A window left sitting under Xvfb stops being drawable after a
          # couple of seconds — it renders fully at 400 ms and not at all at
          # 3000, while still reporting itself mapped and visible. That cost
          # four rounds to find, so it is measured on every run and printed.
          #
          # Reported, not asserted. A check that fails when the workaround
          # becomes unnecessary would turn a GTK update into a red build for
          # something that is not broken.
          timeout 60 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            .build/release/mediafin-gtk --delay 3000 --screenshot late.png || true
          late="$(stat -c %s late.png 2>/dev/null || echo 0)"
          if [ "$late" -lt 12000 ]; then
            echo "late capture (3000 ms): $late bytes — still blank, as expected"
          else
            echo "late capture (3000 ms): $late bytes — this now renders."
            echo "  The early-capture workaround in main.swift may be removable."
          fi
      # The window's buttons, pressed for real.
      #
      # Everything above renders a picture: it proves the window draws, and it
      # has never pressed anything. So "the scan button does nothing and says
      # nothing" was a report this job had no way of contradicting, and a
      # check that cannot run looks exactly like one that passes. This presses
      # Scan and insists the window then says something.
      - name: Pressing Scan must do something and say so
        shell: bash
        run: |
          set -euo pipefail
          # MEDIAFIN_CONFIG_DIR rather than HOME: it is the one variable the
          # engine reads first, so the test points at its config directly
          # instead of relying on how XDG paths are assembled.
          run_window() {
            timeout 90 xvfb-run -a --server-args="-screen 0 1280x900x24" \
              env MEDIAFIN_CONFIG_DIR="$1" .build/release/mediafin-gtk --press-scan
          }

          # First with nothing configured at all, which is the state a new
          # install is in and the one the button used to be greyed out for.
          # Saying nothing here is the exact complaint.
          empty="$(mktemp -d)"
          echo "=== no import folder set ==="
          run_window "$empty" | tee empty.log
          grep -q "^scan button available: true" empty.log || {
            echo "FAIL: the scan button was not even available"; exit 1; }
          grep -qiE "^status: .*(import|Importordner)" empty.log || {
            echo "FAIL: pressing Scan did not name the missing import folder"
            exit 1
          }
          # And it has to say so in the middle of the window, not only in the
          # small dim footer line. "It does nothing, no status, nothing at
          # all" was reported about a window that did in fact answer -- down
          # at the bottom edge, where nobody was looking.
          grep -qiE "^middle: .*(import|Importordner)" empty.log || {
            echo "FAIL: the empty list did not say what happened; only the footer did"
            exit 1
          }
          # The traffic light belongs in the bar at the bottom, not only
          # behind the menu: "is everything plugged in" is the standing
          # question, and a panel you have to open to answer it is a panel
          # nobody opens. It has to carry a verdict and counts, not be blank.
          grep -qE "^lamp bar: .+ · .*[0-9]" empty.log || {
            echo "FAIL: the bar at the bottom says nothing about the lamps"
            grep "^lamp bar:" empty.log || echo "(no lamp bar line at all)"
            exit 1
          }

          # Then with a folder that has a film in it: the button has to
          # produce proposals, not merely a sentence.
          ready="$(mktemp -d)"
          mkdir -p "$ready/config" "$ready/downloads"
          # A real file: the scanner reads names, not contents, but it does
          # insist the file is there.
          : > "$ready/downloads/Tenet.2020.1080p.BluRay.x264-GROUP.mkv"
          # printf and not a heredoc: a heredoc terminator has to sit at
          # column zero, which ends the YAML block scalar it is written in.
          printf '{"sourceFolder":"%s","identification":"offline","language":"en"}\n' \
            "$ready/downloads" > "$ready/config/settings.json"
          # Applying settings has to be visibly an event, not a word that was
          # already on screen. Two presses, and the time has to move.
          # The engine half of a drop. GTK's drag plumbing cannot be faked
          # from a script -- there is no public way to build a drag context --
          # but everything after it can be, and that is the half with the
          # engine in it. A real drop that still dies after this passes
          # narrows the fault to the plumbing, which is worth more than
          # another guess.
          echo "=== handing files over as a drop does ==="
          dropped="$(mktemp -d)"
          mkdir -p "$dropped/config" "$dropped/elsewhere"
          : > "$dropped/elsewhere/Dark.S01E01.GERMAN.1080p.WEB-DL.mkv"
          printf '{"identification":"offline","language":"en"}\n' \
            > "$dropped/config/settings.json"
          timeout 90 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            env MEDIAFIN_CONFIG_DIR="$dropped/config" \
            .build/release/mediafin-gtk --drop \
            "$dropped/elsewhere/Dark.S01E01.GERMAN.1080p.WEB-DL.mkv" 2>&1 \
            | tee dropped.log
          grep -q "^mediafin: drop: 1 handed to the engine" dropped.log || {
            echo "FAIL: the drop never reached the engine"; exit 1; }
          got="$(sed -n 's/^proposals: \([0-9]*\)$/\1/p' dropped.log)"
          echo "proposals from the drop: ${got:-none}"
          test "${got:-0}" -ge 1 || {
            echo "FAIL: a dropped film produced no proposal"; exit 1; }
          # The row has to say WHERE, absolutely. It used to read
          # "-> Dark/Season 01/…" and say nothing about the folder that sits
          # under, which is the difference between a library and burying the
          # file a level deeper where it already lies. Read off the label, so
          # this is what the window shows and not what the engine thinks.
          grep -qE "^destination: → /" dropped.log || {
            echo "FAIL: the row does not say where the file is going"
            grep "^destination:" dropped.log || echo "(no destination line)"
            exit 1
          }

          echo "=== pressing Apply in the settings ==="
          applied="$(mktemp -d)"
          timeout 90 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            env MEDIAFIN_CONFIG_DIR="$applied" \
            .build/release/mediafin-gtk --press-apply | tee applied.log
          first="$(sed -n 's/^applied once: //p' applied.log)"
          second="$(sed -n 's/^applied twice: //p' applied.log)"
          echo "first: ${first:-nothing}"
          echo "second: ${second:-nothing}"
          test -n "$first" || { echo "FAIL: Apply said nothing at all"; exit 1; }
          test "$first" != "$second" || {
            echo "FAIL: the second Apply looked exactly like the first"
            exit 1
          }

          echo "=== with one film to find ==="
          run_window "$ready/config" | tee ready.log
          found="$(sed -n 's/^proposals: \([0-9]*\)$/\1/p' ready.log)"
          echo "proposals after pressing Scan: ${found:-none}"
          test "${found:-0}" -ge 1 || {
            echo "FAIL: pressing Scan found nothing in a folder with a film in it"
            exit 1
          }

      # Before the checks that can fail: the rendered window is the most
      # useful thing this job produces, and a later failing assertion must not
      # be what stops it being readable.
      - name: It fits a small screen
        shell: bash
        env:
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
        run: |
          set -euo pipefail
          # The bug this asserts against, and the reason it is measured and
          # not reasoned about: a GtkWindow cannot be made shorter than its
          # content's minimum height. The left column's minimum was around a
          # thousand pixels - six cards at 18px padding, plus a 260px floor
          # under the proposals list - so on a 1366x768 laptop the window
          # opened taller than the screen and the row carrying "Umbenennen"
          # and "Rueckgaengig", and the footer under it, sat below the bottom
          # edge. Resizing, maximising and fullscreen could none of them help,
          # because there was no shorter size for the window to take.
          #
          # Two screens, because they catch different faults:
          #
          #   1024x600 is a netbook, the smallest screen anybody runs a
          #   desktop on. It checks the OPENING size: what the user is given
          #   on launch has to fit. The first version of this fix passed
          #   everything except this and came out 624 pixels tall, because
          #   set_default_size sets the content size and the measurement
          #   includes the header bar.
          #
          #   1024x420 is not a real screen. It checks the MINIMUM size: the
          #   window can only be this short if the column really does scroll,
          #   so this is the line that fails if anyone puts a tall floor back
          #   under the list.
          #
          # Under Xvfb there are no panels, so the whole screen is the work
          # area and the window may use all of it.
          failed=0
          for size in 1024x600 1024x420; do
            sw="${size%x*}"
            sh="${size#*x}"
            out="window-${size}.png"
            timeout 90 xvfb-run -a --server-args="-screen 0 ${sw}x${sh}x24" \
              .build/release/mediafin-gtk --demo --screenshot "$out" > "shot-${size}.log" 2>&1 || {
                echo "FAIL: $size - mediafin-gtk did not complete"
                cat "shot-${size}.log"
                failed=1
                continue
              }
            dims="$(file "$out" | sed -n 's/.*PNG image data, \([0-9]*\) x \([0-9]*\).*/\1 \2/p')"
            if [ -z "$dims" ]; then
              echo "FAIL: $size - could not read the PNG size"
              failed=1
              continue
            fi
            w="${dims% *}"
            h="${dims#* }"
            bytes="$(stat -c %s "$out")"
            echo "screen ${sw}x${sh} -> window ${w}x${h}, ${bytes} bytes"
            # What the window said about itself at the moment of capture.
            # Printed at every size and asserted at none: it is the only
            # thing that distinguishes "drew nothing" from "was not
            # drawable", and the one time it was needed it had been
            # swallowed into a log file nobody cat'd.
            sed -n 's/^mediafin-gtk: \(capture state.*\)$/  \1/p' "shot-${size}.log"
            [ "$h" -le "$sh" ] || {
              echo "  FAIL: ${h}px tall on a ${sh}px screen - the bottom cannot be reached"
              failed=1
            }
            [ "$w" -le "$sw" ] || {
              echo "  FAIL: ${w}px wide on a ${sw}px screen"
              failed=1
            }
            # Fitting by collapsing to nothing is not fitting - but only
            # where the capture itself can be trusted. At 1024x420 the
            # geometry comes back right (1010x392, which is the whole point
            # of that size) while the image comes back blank at about 2 kB,
            # and the same layout on the same run draws 60 kB at 1024x600.
            # That is a fact about the capture under a 392-pixel Xvfb and
            # not about the window: no real screen is that short, and the
            # taller render covers "it draws". Unexplained rather than
            # understood, which is why the state line above is now printed.
            if [ "$sh" -ge 560 ]; then
              [ "$bytes" -gt 12000 ] || {
                echo "  FAIL: ${bytes} bytes - it fits because it rendered blank"
                failed=1
              }
            else
              echo "  (blank-render check skipped: ${sh}px is below the height"
              echo "   at which this capture is reliable; geometry only)"
            fi
          done
          exit $failed
      - name: Emit the small-screen window as base64
        shell: bash
        run: |
          set -euo pipefail
          echo "--- BEGIN window-1024x600.png base64 ---"
          base64 -w 120 window-1024x600.png
          echo "--- END window-1024x600.png base64 ---"
      - name: Emit the screenshot as base64
        shell: bash
        run: |
          set -euo pipefail
          echo "--- BEGIN window.png base64 ---"
          base64 -w 120 window.png
          echo "--- END window.png base64 ---"
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-window-screenshot
          path: |
            window.png
            window-1024x600.png
            window-1024x420.png
          if-no-files-found: warn
      - name: Refuse to hang without a display
        shell: bash
        run: |
          # No `set -e` here, and no `set +e` either: GitHub already invokes
          # this shell as `bash -e -o pipefail`, so the expected non-zero exit
          # would abort the step before $? could be read. `|| code=$?` is the
          # form that survives -e.
          set -uo pipefail
          code=0
          timeout 20 env -u DISPLAY -u WAYLAND_DISPLAY \
            .build/release/mediafin-gtk --screenshot should-not-exist.png || code=$?
          if [ "$code" != 2 ]; then
            echo "FAIL: expected exit 2 with no display, got $code"
            exit 1
          fi
          if [ -e should-not-exist.png ]; then
            echo "FAIL: wrote a file although it could not start"
            exit 1
          fi
          echo "ok    : exits 2 with no display and writes nothing"

