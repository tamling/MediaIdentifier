name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build & publish the Linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build (Release, static stdlib)
        shell: bash
        run: |
          set -euo pipefail
          # Static Swift runtime so the binary only needs glibc, not a Swift
          # installation, on whatever machine it ends up on.
          swift build -c release --product mediafin --static-swift-stdlib
          BIN=.build/release/mediafin
          test -x "$BIN"
          echo "Size: $(du -h "$BIN" | cut -f1)"
          # A binary that cannot run is not a release asset.
          "$BIN" --help > /dev/null
      - name: Check it does not need a Swift installation
        shell: bash
        run: |
          set -euo pipefail
          if ldd .build/release/mediafin | grep -i "swift"; then
            echo "::error::the binary still links Swift runtime libraries"
            exit 1
          fi
          ldd .build/release/mediafin
      # Copied out before anything else is built. The next step compiles the
      # GTK front-end without --static-swift-stdlib, and SwiftPM shares one
      # build directory: a rebuild with different flags can replace the
      # static binary with a dynamic one, and the release would then need a
      # Swift installation it promises not to need.
      - name: Set the headless runner aside
        shell: bash
        run: |
          set -euo pipefail
          install -d dist
          install -m 755 .build/release/mediafin dist/mediafin
      - name: Build the native window
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq pkg-config libgtk-3-dev
          # Static Swift runtime, exactly like the server. Linking GTK from
          # the system says nothing about Swift's own runtime: built without
          # this the binary needs libswiftCore.so, which no ordinary machine
          # has, and it dies before main() with a loader error.
          swift build -c release --product mediafin-gtk --static-swift-stdlib
          install -m 755 .build/release/mediafin-gtk dist/mediafin-gtk
          # Checked here and not only after installing: the test container is
          # the Swift image, so a dynamically linked binary runs there and
          # fails on a user's machine. ldd tells the truth in both.
          if ldd dist/mediafin-gtk | grep -i swift; then
            echo "::error::the window still links Swift runtime libraries"
            exit 1
          fi
          ldd dist/mediafin-gtk
          dist/mediafin-gtk --version
      - name: Package the tarball
        shell: bash
        run: |
          set -euo pipefail
          install -m 644 LICENSE dist/LICENSE
          install -m 644 README.md dist/README.md
          tar -czf mediafin-linux-x86_64.tar.gz -C dist .
          sha256sum mediafin-linux-x86_64.tar.gz
          echo "contents:"
          tar -tzf mediafin-linux-x86_64.tar.gz | sed 's/^/  /'
      - name: Build the .deb
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # dpkg-shlibdeps needs dpkg-dev. lintian is deliberately not
          # installed here: it only reports style, and it drags in a large
          # Perl dependency tree on every release.
          apt-get install -y -qq dpkg-dev
          # Both binaries by path, from dist/ rather than from the build
          # directory: dist/mediafin is the static one captured before the
          # GTK build, which is the whole point of having set it aside.
          ./tools/build-deb.sh --binary dist/mediafin --gtk-binary dist/mediafin-gtk
          # The version lives in the package metadata; the asset name stays
          # stable so each release replaces the last instead of piling up.
          cp mediafin_*.deb mediafin-linux-x86_64.deb
          dpkg-deb --field mediafin-linux-x86_64.deb Package Version Depends
          sha256sum mediafin-linux-x86_64.deb
      # Installing it is the only check that proves the dependency list is
      # right: apt refuses the package if anything it declares is missing.
      #
      # Every check runs and reports itself, then the step exits non-zero if
      # any failed. An `echo` before a `test` is worse than useless: the last
      # line printed names the check that FAILED, which reads like the one
      # that passed.
      - name: Install the .deb and run it
        shell: bash
        run: |
          set -uo pipefail
          # curl is not in the Swift container, and the HTTPS check below hides
          # stderr, so without this the "server did not come up" verdict would
          # really mean "curl: command not found", sixty times over.
          apt-get install -y -qq curl file
          apt-get install -y -qq ./mediafin-linux-x86_64.deb

          echo "=== files the package installed ==="
          dpkg -L mediafin
          echo "=== declared dependencies ==="
          dpkg-deb --field mediafin-linux-x86_64.deb Package Version Depends Recommends

          failed=0
          check() {
            if eval "$2" >/dev/null 2>&1; then
              echo "ok    : $1"
            else
              echo "FAIL  : $1   [$2]"
              failed=1
            fi
          }

          check "binary is on PATH"            'command -v mediafin'
          check "binary runs"                  'mediafin --help'
          check "window binary is on PATH"     'command -v mediafin-gtk'
          # --version needs no display, so it is the one way to prove the
          # window binary actually runs inside a container.
          check "window binary runs"           'mediafin-gtk --version'
          # The decisive one. This test runs inside the Swift container, so a
          # binary that needs libswiftCore.so runs here and dies on a user's
          # machine with "error while loading shared libraries". It shipped
          # exactly once that way. ldd does not care what is installed.
          check "window needs no Swift runtime"  '! ldd /usr/bin/mediafin-gtk | grep -qi swift'
          check "runner needs no Swift runtime"  '! ldd /usr/bin/mediafin | grep -qi swift'
          check "desktop entry installed"      'test -f /usr/share/applications/mediafin.desktop'
          check "desktop entry points at it"   'grep -q "^Exec=mediafin-gtk$" /usr/share/applications/mediafin.desktop'
          # The package must pull GTK in, or the menu entry starts nothing.
          check "GTK is a declared dependency" 'dpkg-deb --field mediafin-linux-x86_64.deb Depends | grep -q libgtk-3-0'
          # Both report the same version, which is the reason it is read from
          # one source rather than written in two.
          check "versions agree"               'dpkg-deb --field mediafin-linux-x86_64.deb Version | grep -q "^$(mediafin-gtk --version | sed "s/^Mediafin //")"'
          # Asserted against the package, not the filesystem: the Ubuntu base
          # image ships /etc/dpkg/dpkg.cfg.d/excludes with
          # "path-exclude /usr/share/man/*", so dpkg lists the man page in
          # `dpkg -L` but never unpacks it here. What matters is that the
          # package carries it for a real installation.
          check "man page is in the package"   'dpkg-deb --contents mediafin-linux-x86_64.deb | grep -q "usr/share/man/man1/mediafin.1.gz"'
          check "systemd unit installed"       'test -f /usr/lib/systemd/system/mediafin.service || test -f /lib/systemd/system/mediafin.service'
          check "unit is NOT enabled"          '! test -e /etc/systemd/system/multi-user.target.wants/mediafin.service'
          check "state dir is 0700 mediafin"   'test "$(stat -c "%U %a" /var/lib/mediafin)" = "mediafin 700"'
          check "copyright installed"          'test -f /usr/share/doc/mediafin/copyright'
          check "changelog installed"          'test -f /usr/share/doc/mediafin/changelog.Debian.gz'
          check "no stray files at the root"   '! test -e /.shlibdeps'
          # The package's "./" entry is the filesystem root on the target
          # machine, and dpkg applies an archived directory's mode even when
          # the directory already exists. A staging root left at mktemp's 0700
          # would therefore chmod / to 0700 on install. CI runs as root, which
          # hides the damage, so assert on the archive instead.
          check "package root is 0755"         'test "$(dpkg-deb -c mediafin-linux-x86_64.deb | awk "\$NF == \"./\" { print \$1 }")" = drwxr-xr-x'
          # dpkg-deb defaults to zstd here, but apt is built without zstd on
          # Debian-based systems, where it then refuses the file outright:
          # "E: Unsupported file ... given on commandline". CI's own apt reads
          # zstd fine, so only an assertion on the archive catches this.
          check "not zstd-compressed"          '! file mediafin-linux-x86_64.deb | grep -q zst'
          check "xz-compressed"                'file mediafin-linux-x86_64.deb | grep -q "data compression xz"'

          # There is no server to curl any more. What the installed package
          # has to prove is that the headless runner works from a plain apt
          # install: --once has to finish, because the systemd unit and any
          # cron line the user writes both depend on it returning.
          echo "=== the headless runner works after a plain apt install ==="
          export MEDIAFIN_CONFIG_DIR="$PWD/.deb-smoke"
          if timeout 90 mediafin --once > deb.log 2>&1; then
            check "--once finished"            'true'
          else
            echo "FAIL  : mediafin --once did not finish"
            cat deb.log
            failed=1
          fi
          check "unit starts the runner" \
            'grep -q "^ExecStart=/usr/bin/mediafin --watch$" /usr/lib/systemd/system/mediafin.service'

          echo "=== purge leaves nothing behind ==="
          apt-get purge -y -qq mediafin
          check "binary removed"               '! test -e /usr/bin/mediafin'
          check "state dir removed"            '! test -e /var/lib/mediafin'

          exit $failed
      # softprops/action-gh-release creates the "latest" tag only when it is
      # missing and leaves an existing one where it is. So the tag had sat on
      # the commit that first added this workflow while the assets beside it
      # were rebuilt on every release: the binaries were right and the release
      # page's own "Source code" links pointed somewhere else entirely.
      # Moves the rolling tag to the commit this release was built from.
      # softprops/action-gh-release creates "latest" when it is missing and
      # leaves an existing one where it is, so without this the tag sat on the
      # commit that first added this workflow while the assets beside it were
      # rebuilt every time: the release page's "Source code" links pointed
      # somewhere else entirely.
      #
      # With git rather than the API. The API route took a PATCH to
      # /git/refs/tags%2Flatest -- Octokit encodes the slash -- and it answered
      # 403 on one run having answered 200 on the one before, same code, same
      # token. git uses the credentials checkout already configured and asks a
      # simpler question.
      #
      # NOT fatal. The tag is a label; the binaries are the delivery, and they
      # carry whatever bug fix somebody is waiting for. A release that refuses
      # to publish them because a label would not move is the wrong trade. It
      # warns instead, which shows up on the run, so a tag that stops moving
      # cannot go unnoticed either.
      - name: Point the "latest" tag at this commit
        shell: bash
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$PWD" || true
          if git tag -f latest "$GITHUB_SHA" \
            && git push -f origin "refs/tags/latest"; then
            echo "latest now points at $GITHUB_SHA"
          else
            echo "::warning title=The \"latest\" tag did not move::The release" \
              "page will name an older commit than the assets were built from." \
              "The assets themselves are current."
          fi
      # The macOS half used to remove assets a release no longer produces, and
      # it is gone. Without this, Mediafin.app.zip would sit in the release for
      # ever with a date from whenever it was last built, next to Linux files
      # from today -- a release claiming to contain something it does not
      # build, which is the fault I spent this morning fixing.
      # The macOS half used to remove assets a release no longer produces, and
      # it is gone. Without this, Mediafin.app.zip would sit in the release for
      # ever with a date from whenever it was last built, next to Linux files
      # from today -- a release claiming to contain something it does not
      # build, which is the fault I spent this morning fixing.
      #
      # github-script and not gh: the Swift container has no gh, and the tag
      # step above already proves this route works from in here.
      - name: Remove assets this release no longer produces
        uses: actions/github-script@v7
        with:
          script: |
            const gone = ['Mediafin.app.zip']
            let release
            try {
              release = await github.rest.repos.getReleaseByTag(
                { ...context.repo, tag: 'latest' })
            } catch (error) {
              if (error.status !== 404) throw error
              core.info('no "latest" release yet, nothing to clean up')
              return
            }
            for (const asset of release.data.assets) {
              if (!gone.includes(asset.name)) continue
              // Not fatal, for the same reason the tag move is not: tidying up
              // an asset this release no longer builds must not stop it
              // publishing the ones it does. A warning shows on the run.
              try {
                await github.rest.repos.deleteReleaseAsset(
                  { ...context.repo, asset_id: asset.id })
                core.info(`removed ${asset.name}`)
              } catch (error) {
                core.warning(`could not remove ${asset.name}: ${error.message}`)
              }
            }
      # First, and unconditionally: a path to the binaries that nothing can
      # refuse. The release upload below needs a permission the token has just
      # been refused twice, and a build that produces a working .deb and then
      # has no way to hand it over is not a release at all. Artefacts live on
      # the run page and need no release permission.
      - name: Keep the packages as run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediafin-linux-x86_64
          path: |
            mediafin-linux-x86_64.deb
            mediafin-linux-x86_64.tar.gz
          if-no-files-found: error

      # Replaces the assets on the existing "latest" release WITHOUT updating
      # the release itself.
      #
      # softprops/action-gh-release used to do this, and it PATCHes the release
      # to set its name and flags before uploading. That PATCH answered 403,
      # "Resource not accessible by integration", on two runs having worked on
      # the one before — so the binaries never got published although they had
      # built and passed every check. The release's own metadata has not
      # changed in months and does not need writing on every build; only the
      # files do. So this deletes and re-uploads just the files, which is a
      # different endpoint.
      #
      # If that is refused too, the step says so and names the setting that
      # grants it, and the artefacts above are still there.
      - name: Replace the packages on the "latest" release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const names = ['mediafin-linux-x86_64.deb', 'mediafin-linux-x86_64.tar.gz']
            const release = await github.rest.repos.getReleaseByTag(
              { ...context.repo, tag: 'latest' })
            for (const name of names) {
              const old = release.data.assets.find(a => a.name === name)
              try {
                if (old) {
                  await github.rest.repos.deleteReleaseAsset(
                    { ...context.repo, asset_id: old.id })
                }
                await github.rest.repos.uploadReleaseAsset({
                  ...context.repo,
                  release_id: release.data.id,
                  name,
                  headers: {
                    'content-type': 'application/octet-stream',
                    'content-length': fs.statSync(name).size,
                  },
                  data: fs.readFileSync(name),
                })
                core.info(`uploaded ${name}`)
              } catch (error) {
                core.setFailed(
                  `could not put ${name} on the release: ${error.message}. ` +
                  'If this is "Resource not accessible by integration", the ' +
                  'repository needs Settings -> Actions -> General -> ' +
                  'Workflow permissions set to "Read and write permissions". ' +
                  'The package is on this run as an artefact either way.')
              }
            }
